name: Daily database keepalive

on:
  schedule:
    # 05:00 UTC / 06:00 West Africa Time, once per day.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-database-keepalive
  cancel-in-progress: false

jobs:
  query-database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query database through the protected backend job
        env:
          JOBS_SECRET_KEY: ${{ secrets.JOBS_SECRET_KEY }}
        run: |
          if [ -z "$JOBS_SECRET_KEY" ]; then
            echo "JOBS_SECRET_KEY is not configured in GitHub Actions secrets."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --request POST \
            --header "x-jobs-secret: $JOBS_SECRET_KEY" \
            https://lettyecommerce.onrender.com/api/jobs/database-keepalive
