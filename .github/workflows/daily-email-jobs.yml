name: Daily email jobs

on:
  schedule:
    # Once daily, after the DB keepalive (05:00 UTC) and comfortably ahead
    # of the EU/US morning. Each job is idempotent per run.
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-email-jobs
  cancel-in-progress: false

jobs:
  run-email-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call the protected daily email jobs
        env:
          JOBS_SECRET_KEY: ${{ secrets.JOBS_SECRET_KEY }}
        run: |
          if [ -z "$JOBS_SECRET_KEY" ]; then
            echo "JOBS_SECRET_KEY is not configured in GitHub Actions secrets."
            exit 1
          fi

          call_job () {
            echo "--- POST /api/jobs/$1 ---"
            curl --fail-with-body --silent --show-error \
              --retry 3 --retry-delay 5 --retry-all-errors \
              --request POST \
              --header "x-jobs-secret: $JOBS_SECRET_KEY" \
              "https://lettyecommerce.onrender.com/api/jobs/$1"
            echo ""
          }

          call_job "abandoned-cart"
          sleep 15
          call_job "review-requests"
          sleep 15
          call_job "satisfaction-survey"
