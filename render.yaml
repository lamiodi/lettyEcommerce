services:
  - type: web
    name: letty-backend
    env: node
    rootDir: backend
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        value: https://www.houseofletty.com
      - key: FRONTEND_ORIGINS
        value: "https://www.houseofletty.com,https://houseofletty.com,https://letty-ecommerce.vercel.app,http://localhost:3000"
      - key: DATABASE_URL
        placeholder: "postgresql://user:password@host:5432/database?sslmode=require"
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://hjqylutputroxwmicdaq.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        placeholder: "eyJhbGciOi..."
      - key: SUPABASE_SERVICE_ROLE_KEY
        placeholder: "eyJhbGciOi..."
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CLOUDINARY_URL
        placeholder: "cloudinary://api_key:api_secret@cloud_name"
      - key: CLOUDINARY_CLOUD_NAME
        value: jtsxpm1l
      - key: CLOUDINARY_API_KEY
        value: "322453112285667"
      - key: CLOUDINARY_API_SECRET
        placeholder: "your_cloudinary_api_secret"
      - key: NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME
        value: jtsxpm1l
      - key: STRIPE_SECRET_KEY
        placeholder: "rk_live_... or rk_test_..."
      - key: STRIPE_PUBLISHABLE_KEY
        placeholder: "pk_live_... or pk_test_..."
      - key: STRIPE_WEBHOOK_SECRET
